  <h1 class="govuk-heading-xl">
    DPS starter prototype
  </h1>

  <p class="govuk-body">This prototype is a starter set of pages to build prototypes for DPS (Digital Prison Services).</p>

  <p class="govuk-body">Before you start you should <a href="https://design-patterns.service.justice.gov.uk/prototyping/setting-up-coded-prototypes/" target="_blank">install the MOJ Frontend npm package.</a></p>

  <p class="govuk-body">You may also need to update the GOV.UK prototype kit or Frontend, which you can check <a href="/manage-prototype/plugins" target="_blank">check here.</a></p>
